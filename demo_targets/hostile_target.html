<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acme Cloud Gear — Staging Checkout</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .checkout-container { position: relative; margin-top: 50px; }
        #checkout-btn {
            background-color: #0066cc;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            cursor: pointer;
        }
        .promo-sticky-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 60px;
            background-color: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <h1>Acme Cloud Gear — Staging Checkout</h1>
    <div class="checkout-container">
        <button id="checkout-btn">Complete Purchase ($299.00)</button>
        <div class="promo-sticky-banner">
            🔥 SPECIAL OFFER: Save 20% with code CHAOS20!
        </div>
    </div>
</body>
</html>
