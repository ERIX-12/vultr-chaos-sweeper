version: "3.9"
services:
  orchestrator:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  hostile-demo-target:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./demo_targets:/usr/share/nginx/html:ro
